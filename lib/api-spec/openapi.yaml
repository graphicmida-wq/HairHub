openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Lumii salon management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: services
    description: Service management
  - name: products
    description: Product/inventory management
  - name: stock
    description: Stock movements and over-the-counter sales
  - name: brands
    description: Colours of product brands (brands are free text on products)
  - name: appointments
    description: Appointment management
  - name: settings
    description: Salon settings
  - name: staff
    description: Staff/team management
  - name: client-formulas
    description: Client formula management
  - name: auth
    description: Authentication
  - name: team
    description: People of the salon (agenda + app access), admin only

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client and their appointments
      responses:
        "204":
          description: Deleted

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getService
      tags: [services]
      summary: Get a service by ID
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateService
      tags: [services]
      summary: Update a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceInput"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      responses:
        "204":
          description: Deleted

  /products/{id}/movements:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteProductMovements
      tags: [stock]
      summary: >-
        Admin only. Delete a product's history (manual movements and its lines of
        counter sales), before deleting a product created by mistake. Movements of
        appointments stay with their appointments.
      responses:
        "200":
          description: Movements deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMovementsResult"

  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: The salon's brands, product categories and service categories, with usage counts
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalog/tags:
    post:
      operationId: addCatalogTag
      tags: [catalog]
      summary: Admin only. Add a brand or category (it can exist with no product yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogTagInput"
      responses:
        "201":
          description: Updated catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "409":
          description: Already in the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: renameCatalogTag
      tags: [catalog]
      summary: >-
        Admin only. Rename a brand or category; renaming it to another existing one
        merges the two. Products/services using it follow (and, for a brand, its
        colour and the brand shown in the movement history).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameCatalogTagInput"
      responses:
        "200":
          description: Updated catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalog/tags/delete:
    post:
      operationId: deleteCatalogTag
      tags: [catalog]
      summary: >-
        Admin only. Delete a brand or category. If products/services still use it,
        moveTo is required and they move there first (409 without it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCatalogTagInput"
      responses:
        "200":
          description: Updated catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "409":
          description: Still in use and no moveTo given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /brand-colors:
    get:
      operationId: listBrandColors
      tags: [brands]
      summary: List the colours assigned to brands
      responses:
        "200":
          description: Brand colours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandColor"
    put:
      operationId: setBrandColor
      tags: [brands]
      summary: Set (or with color null remove) the colour of a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBrandColorInput"
      responses:
        "200":
          description: All brand colours after the change
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandColor"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stock-movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      summary: List stock movements (newest first), optionally filtered
      parameters:
        - name: from
          in: query
          required: false
          description: "First day included, YYYY-MM-DD"
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Last day included, YYYY-MM-DD"
          schema:
            type: string
        - name: productId
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockMovementReason"
      responses:
        "200":
          description: List of stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"

  /stock-movements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteStockMovement
      tags: [stock]
      summary: >-
        Admin only. Delete a movement entered by mistake and correct the stock;
        a counter sale is deleted whole. Movements of an appointment are refused (409).
      responses:
        "200":
          description: Movements deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMovementsResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Movement of an appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /sales:
    post:
      operationId: createSale
      tags: [stock]
      summary: Record an over-the-counter sale (one movement per item) and deduct stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleInput"
      responses:
        "201":
          description: Movements created for the sale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /sales/{saleId}/cancel:
    parameters:
      - name: saleId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelSale
      tags: [stock]
      summary: Cancel an over-the-counter sale with reversing movements (stock goes back)
      responses:
        "200":
          description: Reversing movements created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Sale already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List all appointments
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment by ID
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentInput"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      responses:
        "204":
          description: Deleted

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /client-formulas:
    get:
      operationId: listClientFormulas
      tags: [client-formulas]
      summary: List client formulas
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of client formulas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientFormula"
    post:
      operationId: createClientFormula
      tags: [client-formulas]
      summary: Create a new client formula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientFormulaInput"
      responses:
        "201":
          description: Created client formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFormula"

  /client-formulas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getClientFormula
      tags: [client-formulas]
      summary: Get a client formula by ID
      responses:
        "200":
          description: Client formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFormula"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateClientFormula
      tags: [client-formulas]
      summary: Update a client formula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientFormulaInput"
      responses:
        "200":
          description: Updated client formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFormula"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteClientFormula
      tags: [client-formulas]
      summary: Delete a client formula
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get salon settings
      responses:
        "200":
          description: Salon settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update salon settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalonSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonSettings"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /team:
    get:
      operationId: listTeam
      tags: [team]
      summary: List the people of the salon with their app access (admin only)
      responses:
        "200":
          description: People of the salon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Add a person, optionally with app access (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /team/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a person and give, change or remove app access (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberInput"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Delete a person and their app access (admin only)
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        name:
          type: string
          nullable: true
        staffId:
          type: string
          nullable: true
          description: The person (staff member) this login belongs to
        permissions:
          type: array
          description: Sections of the app this login can see (admins see all)
          items:
            $ref: "#/components/schemas/AppSection"
      required:
        - id
        - username
        - role
        - permissions

    AppSection:
      type: string
      enum: [agenda, clienti, servizi, vendite, incassi, magazzino]

    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    Client:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        dob:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        hairSpecs:
          type: string
          nullable: true
      required:
        - id
        - firstName
        - lastName
        - phone
        - email

    CreateClientInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        dob:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        hairSpecs:
          type: string
          nullable: true
      required:
        - firstName
        - lastName
        - phone
        - email

    UpdateClientInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        dob:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        hairSpecs:
          type: string
          nullable: true

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        color:
          type: string
        durationMins:
          type: integer
        price:
          type: number
        notes:
          type: string
          nullable: true
      required:
        - id
        - name
        - category
        - color
        - durationMins
        - price

    CreateServiceInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        color:
          type: string
        durationMins:
          type: integer
        price:
          type: number
        notes:
          type: string
          nullable: true
      required:
        - name
        - category
        - color
        - durationMins
        - price

    UpdateServiceInput:
      type: object
      properties:
        name:
